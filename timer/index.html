<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업 타이머</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf8ef;
    --card: #ffffff;
    --ink: #2b2a33;
    --muted: #6b6878;
    --line: #ece4d3;
    --c: #7bd389;
    --c-soft: #dff5dc;
    --warn: #ffb347;
    --end: #ff7a59;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", sans-serif;
    display: flex;
    flex-direction: column;
    padding: 16px;
    -webkit-user-select: none;
    user-select: none;
    transition: background .3s;
  }
  body.ended { animation: flash 1s 4; }
  @keyframes flash { 50% { background: #ffe1d6; } }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .top h1 { font-family: "Jua", sans-serif; font-weight: 400; font-size: clamp(1.8rem, 4vw, 2.8rem); margin: 0; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; }
  .tools a, .tools button {
    font: inherit; font-size: 1.05rem;
    padding: 10px 18px; border-radius: 14px;
    border: 2px solid var(--line); background: var(--card); color: var(--ink);
    text-decoration: none; cursor: pointer;
  }

  .vol {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 14px 4px 6px;
    border: 2px solid var(--line); border-radius: 14px; background: var(--card);
  }
  .vol button { border: none !important; padding: 6px 8px !important; font-size: 1.4rem !important; background: transparent !important; }
  .vol span { min-width: 2.2em; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .vol input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: clamp(110px, 16vw, 200px); height: 10px; border-radius: 99px;
    background: linear-gradient(to right, var(--c) var(--p, 70%), #f1ede4 var(--p, 70%));
    cursor: pointer; touch-action: none;
  }
  .vol input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%;
    background: #fff; border: 3px solid var(--c); box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  .vol input[type=range]::-moz-range-thumb {
    width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 3px solid var(--c);
  }
  .vol.muted input[type=range] { filter: grayscale(1); opacity: .5; }

  main {
    flex: 1; background: var(--card); border: 3px solid var(--line); border-radius: 28px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    padding: 24px;
  }
  .time {
    font-family: "Jua", sans-serif; line-height: 1;
    font-size: min(34vh, 24vw);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    transition: color .3s;
  }
  .time.warn { color: #d9822b; }
  .time.end { color: var(--end); }
  .msg { font-family: "Jua", sans-serif; font-size: clamp(1.4rem, 3vw, 2.2rem); color: var(--muted); min-height: 1.2em; }

  .bar { width: min(900px, 90%); height: 22px; background: #f1ede4; border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; width: 100%; background: var(--c); border-radius: 99px; transition: width 1s linear, background .3s; }
  .fill.warn { background: var(--warn); }
  .fill.end { background: var(--end); }

  .presets, .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .presets button, .controls button {
    font-family: "Jua", sans-serif; font-size: clamp(1.3rem, 2.4vw, 1.9rem);
    padding: 12px 26px; border-radius: 18px; border: none; cursor: pointer; touch-action: manipulation;
  }
  .presets button { background: var(--c-soft); color: var(--ink); }
  .presets button.adj { background: #f1ede4; color: var(--muted); }
  .controls .start { background: var(--c); color: var(--ink); min-width: 180px; }
  .controls .reset { background: #f1ede4; color: var(--muted); }
  button:active { transform: scale(.96); }
  .presets.locked button:not(.adj) { opacity: .4; pointer-events: none; }
  .presets.locked button.adj { background: #ffe9a8; color: var(--ink); }
</style>
</head>
<body>
  <div class="top">
    <h1>⏱️ 수업 타이머</h1>
    <div class="tools">
      <a href="../">← 메뉴</a>
      <button id="full" type="button">전체 화면</button>
      <div class="vol" id="volBox">
        <button id="sound" type="button" aria-label="소리 켜기/끄기">🔔</button>
        <input id="vol" type="range" min="0" max="100" step="5" aria-label="음량">
        <span id="volNum">70</span>
      </div>
    </div>
  </div>

  <main>
    <div class="time" id="time" aria-live="off">05:00</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="msg" id="msg">시간을 고르고 시작을 눌러요</div>

    <div class="presets" id="presets">
      <button data-m="1">1분</button>
      <button data-m="3">3분</button>
      <button data-m="5">5분</button>
      <button data-m="10">10분</button>
      <button data-m="15">15분</button>
      <button class="adj" data-add="-60">−1분</button>
      <button class="adj" data-add="60">+1분</button>
    </div>

    <div class="controls">
      <button class="start" id="start" type="button">시작</button>
      <button class="reset" id="reset" type="button">다시</button>
    </div>
  </main>

<script>
  const $ = id => document.getElementById(id);
  const timeEl = $("time"), fill = $("fill"), msg = $("msg"), startBtn = $("start"), presets = $("presets");

  let setSec = 300;      // 정한 시간
  let left = 300;        // 남은 시간
  let endAt = null;      // 끝나는 시각(ms)
  let tick = null;
  let soundOn = true, volume = 70;
  try {
    soundOn = localStorage.getItem("class-apps-timer-sound") !== "off";
    const v = parseInt(localStorage.getItem("class-apps-timer-volume"), 10);
    if (v >= 0 && v <= 100) volume = v;
  } catch (e) {}
  const gainFor = v => 2.6 * Math.pow(v / 100, 1.6);

  function fmt(s) {
    const m = Math.floor(s / 60), r = s % 60;
    return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
  }

  function paint() {
    timeEl.textContent = fmt(left);
    const ratio = setSec ? left / setSec : 0;
    fill.style.width = (ratio * 100) + "%";
    const warn = left > 0 && left <= Math.min(60, setSec * 0.2);
    const end = left === 0;
    timeEl.classList.toggle("warn", warn);
    timeEl.classList.toggle("end", end);
    fill.classList.toggle("warn", warn);
    fill.classList.toggle("end", end);
  }

  function setTime(sec) {
    stop();
    setSec = Math.max(10, Math.min(99 * 60, sec));
    left = setSec;
    document.body.classList.remove("ended");
    msg.textContent = "시간을 고르고 시작을 눌러요";
    paint();
  }

  function start() {
    if (left === 0) setTime(setSec);
    endAt = Date.now() + left * 1000;
    tick = setInterval(update, 200);
    startBtn.textContent = "멈춤";
    presets.classList.add("locked");
    msg.textContent = "집중하는 시간!";
  }

  function stop() {
    clearInterval(tick);
    tick = null;
    endAt = null;
    startBtn.textContent = left === 0 ? "시작" : (left < setSec ? "계속" : "시작");
    presets.classList.remove("locked");
  }

  function update() {
    const s = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
    if (s !== left) { left = s; paint(); }
    if (left === 0) finish();
  }

  function finish() {
    stop();
    startBtn.textContent = "시작";
    msg.textContent = "시간 끝! 👏";
    document.body.classList.remove("ended");
    void document.body.offsetWidth;
    document.body.classList.add("ended");
    chime();
  }

  // ---- 소리 (파일 없이 브라우저에서 직접 만듦) ----
  let ctx = null, master = null;
  function audio() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.knee.value = 6; comp.ratio.value = 8;
      comp.attack.value = 0.002; comp.release.value = 0.2;
      master = ctx.createGain();
      master.gain.value = gainFor(volume);
      master.connect(comp).connect(ctx.destination);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  // 종소리 한 번: 기본음 + 배음들을 겹치고 천천히 사라지게
  function bell(freq, start, ring = 1.6, vol = 0.5) {
    const t = ctx.currentTime + 0.03 + start;
    [[1, 1, ring], [2, 0.5, ring * 0.7], [3, 0.25, ring * 0.45], [4.2, 0.15, ring * 0.3]]
      .forEach(([mult, v, len]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(freq * mult, t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol * v, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + len);
        o.connect(g).connect(master);
        o.start(t);
        o.stop(t + len + 0.05);
      });
  }

  // 끝나는 소리: 학교 종 "딩-동-댕-동~ 딩-동-댕-동~"
  function chime() {
    if (!soundOn || volume === 0) return;
    try {
      audio();
      const E = 1319, C = 1047, D = 1175, G = 784;
      [E, C, D, G, G, D, E, C].forEach((f, k) => {
        const last = k === 3 || k === 7;
        bell(f, k * 0.55 + (k >= 4 ? 0.35 : 0), last ? 2.2 : 1.4, last ? 0.6 : 0.5);
      });
    } catch (e) {}
  }

  // 음량 미리듣기: "딩" 한 번
  function preview() {
    if (!soundOn || volume === 0) return;
    try { audio(); bell(1319, 0, 1.2); } catch (e) {}
  }

  presets.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.m) setTime(Number(b.dataset.m) * 60);
    else adjust(Number(b.dataset.add));
  });

  // ±1분: 진행 중이거나 멈춘 중이면 남은 시간에 바로 더하고 빼기
  function adjust(delta) {
    const running = !!tick;
    const midway = !running && left > 0 && left < setSec;
    if (!running && !midway) { setTime(setSec + delta); return; }

    let next = left + delta;
    next = Math.min(next, 99 * 60);
    if (delta < 0) next = Math.max(next, Math.min(left, 10)); // 빼더라도 최소 10초는 남김
    const diff = next - left;
    if (diff === 0) return;

    left = next;
    setSec = Math.max(setSec + diff, left);
    if (running) endAt += diff * 1000;
    paint();

    const keep = msg.textContent;
    msg.textContent = diff > 0 ? "⏫ 시간 추가!" : "⏬ 시간 줄임!";
    clearTimeout(adjust.t);
    adjust.t = setTimeout(() => {
      msg.textContent = tick ? "집중하는 시간!" : keep;
    }, 1200);
  }

  startBtn.addEventListener("click", () => {
    // 브라우저 정책상 소리는 사용자가 버튼을 누를 때 미리 준비해 둠
    try { audio(); } catch (e) {}
    tick ? stop() : start();
  });
  $("reset").addEventListener("click", () => setTime(setSec));

  const volIn = $("vol"), volNum = $("volNum"), volBox = $("volBox"), soundBtn = $("sound");

  function paintSound() {
    const silent = !soundOn || volume === 0;
    soundBtn.textContent = silent ? "🔕" : volume < 40 ? "🔈" : volume < 75 ? "🔉" : "🔊";
    volBox.classList.toggle("muted", !soundOn);
    volIn.value = volume;
    volIn.style.setProperty("--p", volume + "%");
    volNum.textContent = soundOn ? volume : "끔";
  }
  function saveSound() {
    try {
      localStorage.setItem("class-apps-timer-sound", soundOn ? "on" : "off");
      localStorage.setItem("class-apps-timer-volume", String(volume));
    } catch (e) {}
  }

  soundBtn.addEventListener("click", () => {
    if (volume === 0) { soundOn = true; volume = 70; }
    else soundOn = !soundOn;
    if (master) master.gain.value = gainFor(volume);
    saveSound(); paintSound(); preview();
  });

  volIn.addEventListener("input", () => {
    volume = Number(volIn.value);
    if (!soundOn && volume > 0) soundOn = true;
    if (master) master.gain.value = gainFor(volume);
    saveSound(); paintSound();
  });
  volIn.addEventListener("change", preview);

  // 화면을 처음 누르는 순간 소리 장치를 미리 깨워 둠
  ["pointerdown", "touchstart", "keydown"].forEach(ev =>
    window.addEventListener(ev, () => { try { audio(); } catch (e) {} }, { once: true, passive: true })
  );

  $("full").addEventListener("click", () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    } catch (e) {}
  });

  paintSound();
  paint();
</script>
</body>
</html>
