<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모둠 점수판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf8ef;
    --card: #ffffff;
    --ink: #2b2a33;
    --muted: #6b6878;
    --line: #ece4d3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", sans-serif;
    display: flex;
    flex-direction: column;
    padding: 16px;
    -webkit-user-select: none;
    user-select: none;
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .top h1 { font-family: "Jua", sans-serif; font-weight: 400; font-size: clamp(1.8rem, 4vw, 2.8rem); margin: 0; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; }
  .tools a, .tools button {
    font: inherit;
    font-size: 1.05rem;
    padding: 10px 18px;
    border-radius: 14px;
    border: 2px solid var(--line);
    background: var(--card);
    color: var(--ink);
    text-decoration: none;
    cursor: pointer;
  }
  .tools button:hover, .tools a:hover { border-color: var(--muted); }

  .board {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
  }
  @media (max-width: 900px) { .board { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); } }

  .team {
    position: relative;
    background: var(--card);
    border: 3px solid var(--line);
    border-top: 14px solid var(--c);
    border-radius: 24px;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transition: border-color .2s;
  }
  .team.lead { border-color: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 30%, transparent); }
  .crown { position: absolute; top: -34px; font-size: 2.2rem; opacity: 0; transition: opacity .2s; }
  .team.lead .crown { opacity: 1; }

  .name {
    font-family: "Jua", sans-serif;
    font-size: clamp(1.4rem, 2.6vw, 2.2rem);
    text-align: center;
    width: 100%;
    border: none;
    background: transparent;
    color: var(--ink);
    padding: 4px;
    border-radius: 10px;
  }
  .name:focus { outline: none; }
  .name[readonly] { cursor: default; pointer-events: none; }
  body.editing .name {
    background: #fffaf0;
    border: 3px dashed var(--c);
    cursor: text;
  }
  body.editing .name:focus { border-style: solid; background: #fff; }
  body.editing .btns { opacity: .35; pointer-events: none; }
  .tools button.on { background: #2b2a33; color: #fff; border-color: #2b2a33; }
  .notice {
    display: none;
    margin: -4px 0 14px;
    padding: 10px 16px;
    border-radius: 14px;
    background: #fff3c4;
    font-size: 1.05rem;
  }
  body.editing .notice { display: block; }

  .score {
    font-family: "Jua", sans-serif;
    font-size: clamp(4rem, 9vw, 8rem);
    line-height: 1;
    margin: 6px 0;
    color: var(--ink);
  }
  .score.bump { animation: bump .25s; }
  @keyframes bump { 50% { transform: scale(1.18); } }

  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: auto; }
  .btns button {
    font-family: "Jua", sans-serif;
    font-size: clamp(1.4rem, 2.6vw, 2.2rem);
    padding: 14px 0;
    border: none;
    border-radius: 18px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .plus { background: var(--c); color: var(--ink); grid-column: span 2; }
  .plus5 { background: color-mix(in srgb, var(--c) 55%, white); color: var(--ink); }
  .minus { background: #f1ede4; color: var(--muted); }
  .btns button:active { transform: scale(.96); }
</style>
</head>
<body>
  <div class="top">
    <h1>🏆 모둠 점수판</h1>
    <div class="tools">
      <a href="../">← 메뉴</a>
      <button id="edit" type="button">✏️ 이름 바꾸기</button>
      <button id="reset" type="button">점수 초기화</button>
    </div>
  </div>

  <div class="notice">점선 칸을 눌러 모둠 이름을 고친 뒤 <b>✅ 완료</b>를 눌러 주세요. (최대 10글자)</div>

  <main class="board" id="board"></main>

<script>
  const COLORS = ["#ff9f80", "#ffd166", "#7bd389", "#7cc4ff", "#c3a6ff"];
  const KEY = "class-apps-score-v1";
  let teams = COLORS.map((c, i) => ({ name: (i + 1) + "모둠", score: 0 }));

  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (Array.isArray(saved) && saved.length === COLORS.length) teams = saved;
  } catch (e) {}

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(teams)); } catch (e) {}
  }

  const board = document.getElementById("board");

  function render() {
    board.innerHTML = "";
    teams.forEach((t, i) => {
      const el = document.createElement("section");
      el.className = "team";
      el.style.setProperty("--c", COLORS[i]);
      el.innerHTML = `
        <div class="crown">👑</div>
        <input class="name" maxlength="10" aria-label="모둠 이름">
        <div class="score" aria-live="polite">${t.score}</div>
        <div class="btns">
          <button class="plus" data-d="1">+1</button>
          <button class="plus5" data-d="5">+5</button>
          <button class="minus" data-d="-1">−1</button>
        </div>`;
      const input = el.querySelector(".name");
      input.value = t.name;
      input.readOnly = !editing;
      input.tabIndex = editing ? 0 : -1;
      input.addEventListener("input", () => { teams[i].name = input.value; save(); });
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          e.preventDefault();
          const next = board.children[i + 1];
          if (next) next.querySelector(".name").focus();
          else setEditing(false);
        }
      });
      el.querySelectorAll("button").forEach(b => {
        b.addEventListener("click", () => change(i, Number(b.dataset.d)));
      });
      board.appendChild(el);
    });
    markLeader();
  }

  function change(i, d) {
    teams[i].score = Math.max(0, teams[i].score + d);
    const scoreEl = board.children[i].querySelector(".score");
    scoreEl.textContent = teams[i].score;
    scoreEl.classList.remove("bump");
    void scoreEl.offsetWidth;
    scoreEl.classList.add("bump");
    save();
    markLeader();
  }

  function markLeader() {
    const max = Math.max(...teams.map(t => t.score));
    [...board.children].forEach((el, i) => {
      el.classList.toggle("lead", max > 0 && teams[i].score === max);
    });
  }

  let editing = false;
  const editBtn = document.getElementById("edit");

  function setEditing(on) {
    editing = on;
    document.body.classList.toggle("editing", on);
    editBtn.classList.toggle("on", on);
    editBtn.textContent = on ? "✅ 완료" : "✏️ 이름 바꾸기";
    [...board.querySelectorAll(".name")].forEach((input, i) => {
      if (!on) {
        // 빈칸으로 두면 원래 이름으로 되돌림
        const v = input.value.trim();
        teams[i].name = v || (i + 1) + "모둠";
        input.value = teams[i].name;
        input.blur();
      }
      input.readOnly = !on;
      input.tabIndex = on ? 0 : -1;
    });
    save();
    if (on) {
      const first = board.querySelector(".name");
      first.focus();
      first.select();
    }
  }

  editBtn.addEventListener("click", () => setEditing(!editing));

  document.getElementById("reset").addEventListener("click", () => {
    if (confirm("모든 모둠 점수를 0으로 되돌릴까요?")) {
      teams.forEach(t => t.score = 0);
      save();
      render();
    }
  });

  render();
</script>
</body>
</html>
